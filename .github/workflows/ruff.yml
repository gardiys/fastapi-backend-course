name: Ruff Code Check

on: [push, pull_request]

jobs:
  ruff-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          
      - name: Install Ruff
        run: pip install ruff
          
      - name: Run Ruff check
        run: ruff check --output-format=github .